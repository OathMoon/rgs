[package]
name = "git-svn-rs-shim"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
description = "Opt-in git-svn compatibility shim for git-svn-rs"
include = [
    "/src/**",
    "/LICENSE-APACHE",
    "/LICENSE-MIT",
]

[[bin]]
name = "git-svn"
path = "src/main.rs"
