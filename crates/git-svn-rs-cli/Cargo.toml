[package]
name = "git-svn-rs"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
description = "A Rust implementation of core git svn workflows"
include = [
    "/src/**",
    "/tests/**",
    "/LICENSE-APACHE",
    "/LICENSE-MIT",
]

[features]
default = []
svn-libsvn = ["git-svn-rs-core/svn-libsvn"]

[[bin]]
name = "git-svn-rs"
path = "src/main.rs"

[dependencies]
clap.workspace = true
git-svn-rs-core = { version = "0.1.0", path = "../git-svn-rs-core" }

[dev-dependencies]
assert_cmd.workspace = true
predicates.workspace = true
tempfile.workspace = true
