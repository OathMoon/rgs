name: Frozen compatibility

on:
  workflow_call:
  workflow_dispatch:

jobs:
  frozen-git-svn:
    runs-on: ubuntu-24.04
    env:
      GIT_SVN_RS_STRICT_COMPAT: "1"
      LC_ALL: C
      TZ: UTC
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure compatibility artifacts
        run: |
          echo "GIT_SVN_RS_COMPAT_ARTIFACT_DIR=$RUNNER_TEMP/compat-artifacts" >> "$GITHUB_ENV"
          echo "GIT_SVN_RS_TEST_TMPDIR=$RUNNER_TEMP/git-svn-rs-tests" >> "$GITHUB_ENV"

      - name: Install compatibility dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            apache2 apache2-utils build-essential gettext libapache2-mod-svn \
            libcurl4-openssl-dev libexpat1-dev libssl-dev libsvn-dev \
            libsvn-perl openssh-server pkg-config subversion zlib1g-dev

      - name: Build frozen Git v2.54.0
        env:
          FROZEN_GIT_COMMIT: 0b13e48a3a30cdfa94e8ef842e24d6045ab3d015
          FROZEN_GIT_PREFIX: ${{ runner.temp }}/git-2.54.0
          FROZEN_GIT_SOURCE: ${{ runner.temp }}/git-source
        run: |
          git clone --filter=blob:none https://github.com/git/git.git "$FROZEN_GIT_SOURCE"
          git -C "$FROZEN_GIT_SOURCE" checkout --detach "$FROZEN_GIT_COMMIT"
          make -C "$FROZEN_GIT_SOURCE" -j2 \
            prefix="$FROZEN_GIT_PREFIX" NO_TCLTK=YesPlease all
          make -C "$FROZEN_GIT_SOURCE" \
            prefix="$FROZEN_GIT_PREFIX" NO_TCLTK=YesPlease install
          echo "$FROZEN_GIT_PREFIX/bin" >> "$GITHUB_PATH"

      - name: Verify frozen tools
        run: |
          git --version
          git svn --version
          svn --version --quiet
          pkg-config --modversion libsvn_client
          test -x /usr/sbin/apache2
          test -x /usr/sbin/sshd
          test -x /usr/bin/htpasswd
          test -f /usr/lib/apache2/modules/mod_dav_svn.so

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Strict frozen Perl comparison
        run: cargo test --workspace

      - name: Verify required release artifact summaries
        shell: bash
        run: |
          required_scenarios=(
            standard-linear-history
            standard-layout-history
            standard-full-url-layout-history
            standard-subdirectory-history
            standard-dcommit-write
            authenticated-svn-dcommit-write
            recovered-dcommit-write
            dirty-dcommit-no-write
          )
          for scenario in "${required_scenarios[@]}"; do
            summary="$GIT_SVN_RS_COMPAT_ARTIFACT_DIR/$scenario/scenario-summary.json"
            test -f "$summary"
            grep -Fq '"status": "passed"' "$summary"
            grep -Fq '"execution": "executed"' "$summary"
            grep -Fq '"frozen_git_commit": "0b13e48a3a30cdfa94e8ef842e24d6045ab3d015"' "$summary"
            grep -Fq '"comparison_backend": "svn-cli-vs-frozen-perl"' "$summary"
            grep -Fq '"build_features": "default-svn-cli"' "$summary"
          done

      - name: Linked libsvn integration
        run: cargo test -p git-svn-rs-core --features svn-libsvn

      - name: Linked libsvn serial diagnostic
        run: cargo test -p git-svn-rs-core --features svn-libsvn -- --test-threads=1

      - name: Linked libsvn CLI workflows
        run: cargo test -p git-svn-rs --features svn-libsvn --test clone_fetch_real_svn

      - name: Linked libsvn dcommit workflows
        run: cargo test -p git-svn-rs --features svn-libsvn --test dcommit_linear

      - name: Static gates
        run: |
          cargo fmt --all -- --check
          cargo clippy --all-targets --all-features -- -D warnings

      - name: Write current-SHA release evidence
        shell: bash
        run: |
          commit_sha="$(git rev-parse HEAD)"
          test "$commit_sha" = "$GITHUB_SHA"
          printf '{\n  "schema_version": 2,\n  "status": "passed",\n  "commit_sha": "%s",\n  "required_scenario_count": 8,\n  "scenario_backend": "svn-cli-vs-frozen-perl",\n  "scenario_build_features": "default-svn-cli",\n  "linked_backend_profiles": ["core-parallel", "core-serial", "cli-read-import", "cli-dcommit-post-fetch"]\n}\n' \
            "$commit_sha" > "$GIT_SVN_RS_COMPAT_ARTIFACT_DIR/release-summary.json"

      - name: Upload compatibility artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: frozen-compatibility-artifacts
          path: ${{ runner.temp }}/compat-artifacts
          if-no-files-found: error
