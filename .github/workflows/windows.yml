name: Windows

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      strict_compat:
        description: "Run compatibility tests in strict mode"
        required: false
        default: false
        type: boolean

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Verify
        shell: pwsh
        run: ./scripts/verify.ps1

      - name: Verify strict compatibility
        if: ${{ inputs.strict_compat }}
        shell: pwsh
        run: ./scripts/verify.ps1 -StrictCompat
