[workspace]
members = [
    "crates/git-svn-rs-cli",
    "crates/git-svn-rs-core",
    "crates/git-svn-rs-shim",
]
resolver = "2"

[workspace.package]
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
repository = "https://github.com/OathMoon/rgs"
homepage = "https://github.com/OathMoon/rgs"
readme = "README.md"

[workspace.dependencies]
assert_cmd = "2"
chrono = "0.4"
clap = { version = "4", features = ["derive", "env"] }
fancy-regex = "0.14"
flate2 = "1"
fs2 = "0.4"
hex = "0.4"
libc = "0.2"
md-5 = "0.10"
predicates = "3"
sha2 = "0.10"
tempfile = "3"
thiserror = "2"
url = "2"
vcpkg = "0.2.15"
